name: 功能建议
description: 提出一个新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！为了少走弯路，请重点说明**使用场景**，而不只是「希望加个 X」。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景 / 问题
      description: 现在是怎么做的？哪一步不顺手？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 对话与角色
        - 本地推理引擎 / 档位
        - 长期记忆
        - 界面与交互
        - 构建与文档
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过已有 issue，确认没有重复
          required: true
        - label: 我理解这是个人项目，作者不承诺实现时间
          required: false
